# ============================================================
# ridge.yml
#
# Marker file for this demo archive. Same shape as a real
# project's ridge.yml — this one just points at sample data,
# so RIDGE's real output can be shown publicly without
# exposing the private notes repo.
# ============================================================

id: ridge-agent-demo              # stable identifier, never derived from the folder name
name: RIDGE Demo Archive
git_repo: ../ridge-agent           # optional, for git metadata. If set, RIDGE expects it
                                    # to work — a bad or missing path fails loudly rather
                                    # than being silently skipped.
site_slug: ridge-demo              # which site page this project writes to
conventions:                       # optional. Maps each record type to its folder. A folder
                                    # that doesn't exist yet is fine (no records of that
                                    # type written so far); a convention left blank is not.
  session: docs/sessions/         # sample session logs for the demo
  decision: docs/decisions/       # sample decision records for the demo
  milestone: docs/milestones/     # sample milestone record for the demo
